<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Accepted cards">
  <rect width="1200" height="600" fill="#ffffff" />
  <text x="600" y="110" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="64" fill="#111111" font-style="italic">
    Aqui se paga hoy!
  </text>

  <g font-family="Poppins, Arial, sans-serif" font-weight="600" font-size="42" text-anchor="middle">
    <rect x="90" y="190" width="180" height="110" rx="18" fill="#1a4f9c" />
    <text x="180" y="260" fill="#ffffff">VISA</text>

    <rect x="300" y="190" width="180" height="110" rx="18" fill="#eb001b" />
    <text x="390" y="258" fill="#ffffff" font-size="36">MASTERCARD</text>

    <rect x="510" y="190" width="180" height="110" rx="18" fill="#005baa" />
    <text x="600" y="260" fill="#ffffff">MAGNA</text>

    <rect x="720" y="190" width="180" height="110" rx="18" fill="#2e77bb" />
    <text x="810" y="258" fill="#ffffff" font-size="34">AMERICAN</text>
    <text x="810" y="292" fill="#ffffff" font-size="34">EXPRESS</text>

    <rect x="930" y="190" width="180" height="110" rx="18" fill="#0e3a66" />
    <text x="1020" y="260" fill="#ffffff" font-size="34">DINERS</text>
    <text x="1020" y="292" fill="#ffffff" font-size="34">CLUB</text>
  </g>

  <g font-family="Poppins, Arial, sans-serif" font-weight="600" font-size="46" text-anchor="middle">
    <rect x="140" y="360" width="420" height="130" rx="20" fill="#d62027" />
    <text x="350" y="442" fill="#ffffff">REDCOMPRA</text>

    <rect x="640" y="360" width="420" height="130" rx="20" fill="#e10098" />
    <text x="850" y="442" fill="#ffffff">TRANSBANK</text>
  </g>
</svg>
